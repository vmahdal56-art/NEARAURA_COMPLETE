<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NearAura | Waitlist</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0B0D11] text-white font-sans flex flex-col items-center justify-center min-h-screen">
    <h1 class="text-4xl font-black italic uppercase hero-gradient mb-4">The Founder Gateway</h1>
    <div id="counter-box" class="text-6xl font-black text-orange-500 mb-8">
        Loading...
    </div>
    <p class="text-slate-400 max-w-md text-center">Once this counter hits zero, the Sovereign Elite gateway locks forever.</p>

    <script type="module">
        // Re-injecting the logic I recovered from your logs
        async function fetchStats() {
            try {
                const response = await fetch('https://us-central1-huddleme.cloudfunctions.net/getLaunchStats');
                const data = await response.json();
                document.getElementById('counter-box').innerText = data.remaining;
            } catch (e) {
                document.getElementById('counter-box').innerText = "1,000"; // Fallback
            }
        }
        fetchStats();
    </script>
</body>
</html>
